version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: digital_twin_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - twin_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digital_twin_backend
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=digital_twin_db
      - HOST=0.0.0.0
      - PORT=8000
    networks:
      - twin_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: digital_twin_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - twin_net

volumes:
  mongo_data:

networks:
  twin_net:
    driver: bridge
